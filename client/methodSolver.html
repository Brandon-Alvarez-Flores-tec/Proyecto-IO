<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Transporte / solver</title>
        <meta name="description" content="Resolutor de problemas de transporte: esquina noroeste, costo mínimo y Vogel, paso a paso.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./index.css">
        <link rel="stylesheet" href="./matrix.css">
    </head>
    <body>
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">TX</span>
                <h1>Transporte<span class="brand-sub">/solver</span></h1>
            </div>
            <nav aria-label="Principal">
                <ul class="nav-list">
                    <li><a href="/" aria-current="page">Inicio</a></li>
                    <li><a href="/methodSolver">Esquina noroeste</a></li>
                    <li><a href="/methodSolver">Costo mínimo</a></li>
                    <li><a href="/methodSolver">Vogel</a></li>
                </ul>
            </nav>
        </header>

        <div class="layout">
            <main class="panel-main">
                <div class="section-head">
                    <h2>Resolvedor de método de transporte</h2>
                    <span class="count">03</span>
                </div>
                <div class="section-head">
                    <h3>Opciones</h3>
                    <div class="option-div">
                        <label>Filas</label>
                        <input class="inputCheckAlwaysChanges" type="number" name="" id="rowInput">
                    </div>
                    <div class="option-div">
                        <label>Columnas</label>
                        <input class="inputCheckAlwaysChanges" type="number" name="" id="colInput">
                    </div>
                </div>

                <div class="cards">

                </div>

                <div class="matrix" id="matrix">
                    <!-- <div class="box-row">
                        <div class="box">
                            <div><p>X</p></div>
                        </div>
                    </div> -->
                    


                </div>
                <select id="method-select">
                    <option>northwest</option>
                    <option>minimumCost</option>
                    <option>vogel</option>
                </select>
                <input type="button" value="Ver resultado" id="btn-results">

                <div class="matrix-results">
                    <div class="matrix" id="matrix-results">

                    </div>
                    <div class="matrix-description-step__div">
                        <p class="method-p">Método: </p>
                        <p class="totalCost-p">Costo total: </p>
                        <p class="description-p">Descripción: </p>
                    </div>
                    <div class="step-btns">
                        <p class="step-p">Paso: X</p>
                        <input type="button" value="<" id="btn-left">
                        <input type="button" value=">" id="btn-right">
                    </div>

                </div>
            </main>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="main.js"></script>
        <script src="showResults.js"></script>
    </body>
</html>
